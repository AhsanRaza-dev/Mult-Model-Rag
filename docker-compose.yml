version: "3.8"

services:
  rag-app:
    build: .
    ports:
      - "8000:8000" # Backend
      - "8501:8501" # Frontend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./RAG/data:/app/RAG/data # Persist data if needed
